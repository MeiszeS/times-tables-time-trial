<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Times Tables Time Trial</title>
    <link rel="stylesheet" href="./cool.css">
</head>
<body>
    <h1>Times Tables Time Trial!</h1>
    <div id="infoBar">
        <h3>Correct: 0</h3>
        <h3>Incorrect: 0</h3>
    </div>

    <div id="answerContainer">
        <!-- Conatiner for answer's digits -->
         <h4>***</h4>
    </div>

    <div id="keypadContainer">
        <!-- Conatiner for keypad's digit buttons-->
         <div class="keypadButton" id="one">
            <p>1</p>
        </div>
         <div class="keypadButton" id="two">
            <p>2</p>
        </div>
         <div class="keypadButton" id="three">
            <p>3</p>
        </div>
         <div class="keypadButton" id="four">
            <p>4</p>
        </div>
         <div class="keypadButton" id="five">
            <p>5</p>
        </div>
         <div class="keypadButton" id="six">
            <p>6</p>
        </div>
         <div class="keypadButton" id="seven">
            <p>7</p>
        </div>
         <div class="keypadButton" id="eight">
            <p>8</p>
        </div>
         <div class="keypadButton" id="nine">
            <p>9</p>
        </div>
         <div class="keypadButton" id="zero">
            <p>0</p>
        </div>
    </div>
</body>
</html>
