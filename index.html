<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Times Tables Time Trial</title>
    <link rel="stylesheet" href="./cool.css">
</head>
<body>
    <h1>Times Tables Time Trial!</h1>
    <div id="infoBar">
        <h3>Correct: 0</h3>
        <h3>Incorrect: 0</h3>
    </div>

    <div id="answerContainer">
        <!-- Conatiner for answer's digits -->
         <h4 id="answerText"></h4>
    </div>

    <div id="keypadContainer">
        <!-- Conatiner for keypad's digit buttons-->
         <button class="keypadButton" id="one">1</button>
         <button class="keypadButton" id="two">2</button>
         <button class="keypadButton" id="three">3</button>
         <button class="keypadButton" id="four">4</button>
         <button class="keypadButton" id="five">5</button>
         <button class="keypadButton" id="six">6</button>
         <button class="keypadButton" id="seven">7</button>
         <button class="keypadButton" id="eight">8</button>
         <button class="keypadButton" id="nine">9</button>
         <button class="keypadButton" id="zero">0</button>
    </div>
</body>
<script src="./math.js"></script>
</html>
