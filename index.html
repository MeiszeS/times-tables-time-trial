<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Times Tables Time Trial</title>
</head>
<body>
    <h1>Times Tables Time Trial!</h1>
    <div id="infoBar">
        <h3>Correct: 0</h3>
        <h3>Incorrect: 0</h3>
    </div>

    <div id="answerContainer">
        <!-- Conatiner for answer's digits -->
         <h4>***</h4>
    </div>

    <div id="keypadContainer">
        <!-- Conatiner for keypad's digit buttons-->
         <h4 class="keypadButton" id="one">1</h4>
         <h4 class="keypadButton" id="two">2</h4>
         <h4 class="keypadButton" id="three">3</h4>
         <h4 class="keypadButton" id="four">4</h4>
         <h4 class="keypadButton" id="five">5</h4>
         <h4 class="keypadButton" id="six">6</h4>
         <h4 class="keypadButton" id="seven">7</h4>
         <h4 class="keypadButton" id="eight">8</h4>
         <h4 class="keypadButton" id="nine">9</h4>
         <h4 class="keypadButton" id="zero">0</h4>
    </div>
</body>
</html>
